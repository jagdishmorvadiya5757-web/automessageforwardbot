server {
  listen 8000;
  server_name _;

  client_max_body_size 20m;

  # CORS for browser clients
  add_header Access-Control-Allow-Origin  $http_origin always;
  add_header Access-Control-Allow-Credentials true always;
  add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, prefer, range, accept-profile, content-profile" always;
  add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers "content-range, content-profile" always;

  location / {
    if ($request_method = OPTIONS) { return 204; }
    return 404;
  }

  location /auth/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rest/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    return 200 "ok";
  }
}
